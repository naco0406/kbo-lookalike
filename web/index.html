    <meta name="theme-color" content="#1c2b3a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="643 — 경기 스코어, 닮은 선수 찾기, 심판 미니게임. 야구 팬을 위한 오늘의 병살타" />
    <title>643 — 오늘의 병살타</title>

    <!-- Fonts: Pretendard + Bebas Neue -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <meta property="og:title" content="643 — 오늘의 병살타" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="643 — 오늘의 병살타" />
    <meta name="twitter:description" content="경기 스코어, 닮은 선수 찾기, 심판 미니게임. puttheballinthebox.com" />
  </head>
  <body>
    <!-- Prevent flash of wrong theme + team colors -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('643-theme'));
        var isDark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      } catch(e) {}
      // Team color: apply accent + background before React mounts
      try {
        var p = JSON.parse(localStorage.getItem('643-profile'));
        if (p && p.favoriteTeam) {
          var tc = {
            LG:'#C30452',SK:'#CE0E2D',LT:'#041E42',HT:'#EA0029',SS:'#074CA1',
            NC:'#315288',WO:'#570514',HH:'#FC4E00',KT:'#000000',OB:'#1A1748'
          };
          var sc = {
            LG:'#000000',SK:'#FFB81C',LT:'#D00F31',HT:'#06141F',SS:'#C0C0C0',
            NC:'#AF917B',WO:'#B07F4A',HH:'#07111F',KT:'#EB1C24',OB:'#EB1D25'
          };
          var pri = tc[p.favoriteTeam], sec = sc[p.favoriteTeam];
          if (pri) {
            var hx = function(c){var r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;if(mx!==mn){var d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=((g-b)/d+(g<b?6:0))/6;else if(mx===g)h=((b-r)/d+2)/6;else h=((r-g)/d+4)/6}return[Math.round(h*360),Math.round(s*100)]};
            var hl = function(h,s,l){s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;var a=s*Math.min(l,1-l);var f=function(n){var k=(n+h/30)%12;var c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
            var hs=hx(pri),h=hs[0],s=hs[1],shs=hx(sec),sh=shs[0],ss2=shs[1];
            var lo=s<15,ah=lo?sh:h,as2=lo?Math.max(ss2,80):Math.max(s,80);
            var acc=hl(ah,as2,isDark?58:44);
            var bg=lo?null:hl(h,20,isDark?7:96);
            var r=document.documentElement.style;
            r.setProperty('--accent',acc);
            r.setProperty('--accent-foreground',isDark?'#ffffff':'#ffffff');
            r.setProperty('--ring',acc);
            r.setProperty('--chart-1',acc);
            r.setProperty('--stadium-green',acc);
            if(bg)r.setProperty('--background',bg);
          }
        }
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Kakao AdFit: must be in static HTML for review approval -->
    <script async src="//t1.daumcdn.net/kas/static/ba.min.js"></script>
  </body>
</html>
